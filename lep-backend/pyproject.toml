[project]
name = "lep-backend"
version = "0.1.0"
description = "Learn English with Play — backend service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.32,<2.1",  # the brief fixes SQLAlchemy 2.0
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "anyio>=4.4",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "tzdata>=2024.1",
    "anthropic>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers>=4.8",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "hypothesis>=6.112",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "BLE", "DTZ", "SIM", "PT", "RUF", "C4",
    "PIE", "RET", "TID", "ARG", "PERF",
]
ignore = [
    "E501",   # line length is black's job
    "RUF012", # pydantic/sqlalchemy class attributes are not mutable-default bugs
    "N818",   # domain errors are named for what happened (NotFound, RateLimited)
]
allowed-confusables = ["–", "×", "…"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "ARG001", "PT011"]
"migrations/**" = ["S608"]
# the grader folds look-alike quotes, dashes and spaces: they are the point of the file
"app/domain/grading.py" = ["RUF001"]
"tests/unit/test_grading_parity.py" = ["RUF001"]
# Uzbek text uses the letter ʻ (oʻ, gʻ): it is spelling, not a look-alike
"app/domain/conversation.py" = ["RUF001"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.utcnow".msg = "Use app.clock or datetime.now(UTC); naive datetimes are banned."

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
explicit_package_bases = true
files = ["app", "migrations", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "testcontainers.*", "docker.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs real PostgreSQL 16 and Redis 7 (testcontainers, or LEP_TEST_* services)",
    "load: the Phase 9 load test against a real API process (opt-in: LEP_LOAD=1)",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's asyncio layer runs through greenlets; without this, lines after a
# database call are reported as never executed.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]
